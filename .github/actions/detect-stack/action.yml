name: "Detect repository stack"
description: >
  Detects languages (via the GitHub/Linguist API, with no custom heuristics to
  maintain), which subset of CodeQL languages they map to, and how the
  application is started (Dockerfile / docker-compose), so that SAST, DAST, IAST
  and Fuzzing don't need manual language configuration from the user.

outputs:
  languages:
    description: "JSON array with the languages reported by GitHub Linguist (lowercase)"
    value: ${{ steps.linguist.outputs.languages }}
  codeql_languages:
    description: "JSON array with the subset supported by github/codeql-action"
    value: ${{ steps.linguist.outputs.codeql_languages }}
  primary_language:
    description: "Language with the most bytes of code in the repo, according to Linguist"
    value: ${{ steps.linguist.outputs.primary_language }}
  has_dockerfile:
    description: "'true' if there is a Dockerfile at the repo root"
    value: ${{ steps.runner.outputs.has_dockerfile }}
  has_compose:
    description: "'true' if there is a docker-compose.yml/yaml or compose.yml/yaml at the root"
    value: ${{ steps.runner.outputs.has_compose }}

runs:
  using: "composite"
  steps:
    - name: Read languages via the GitHub API (Linguist)
      id: linguist
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        langs_json=$(gh api "repos/${{ github.repository }}/languages")
        echo "Languages reported by Linguist: $langs_json"

        primary=$(echo "$langs_json" | jq -r 'to_entries | sort_by(-.value) | .[0].key // "unknown"')
        all=$(echo "$langs_json" | jq -c '[keys[] | ascii_downcase]')

        # Mapping to the language names understood by github/codeql-action.
        # Reference: https://codeql.github.com/docs/codeql-overview/supported-languages-and-frameworks/
        codeql=$(echo "$langs_json" | jq -c '
          [keys[] | ascii_downcase] as $l |
          [
            (if ($l | any(. == "typescript" or . == "javascript")) then "javascript-typescript" else empty end),
            (if ($l | any(. == "python")) then "python" else empty end),
            (if ($l | any(. == "go")) then "go" else empty end),
            (if ($l | any(. == "java" or . == "kotlin")) then "java-kotlin" else empty end),
            (if ($l | any(. == "c" or . == "c++")) then "c-cpp" else empty end),
            (if ($l | any(. == "c#")) then "csharp" else empty end),
            (if ($l | any(. == "ruby")) then "ruby" else empty end),
            (if ($l | any(. == "swift")) then "swift" else empty end)
          ] | unique
        ')

        echo "languages=$all" >> "$GITHUB_OUTPUT"
        echo "codeql_languages=$codeql" >> "$GITHUB_OUTPUT"
        echo "primary_language=$primary" >> "$GITHUB_OUTPUT"

    - name: Detect how the application is started
      id: runner
      shell: bash
      run: |
        set -euo pipefail

        has_dockerfile=false
        has_compose=false

        [ -f "Dockerfile" ] && has_dockerfile=true

        for f in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
          [ -f "$f" ] && has_compose=true
        done

        echo "has_dockerfile=$has_dockerfile" >> "$GITHUB_OUTPUT"
        echo "has_compose=$has_compose" >> "$GITHUB_OUTPUT"
