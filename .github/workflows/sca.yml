name: "Security · SCA"
# Analysis of THIRD-PARTY libraries (runs nothing, only reads manifests/lockfiles).
# Engine: Trivy (fs scan) — detects npm/yarn/pnpm, pip/poetry/pipenv, go.mod/go.sum,
# Gemfile.lock, composer.lock, Cargo.lock, csproj/packages.lock.json, etc. with no
# per-language configuration. Complemented by dependency-review-action on PRs.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 5 * * *' # daily: alerts you to new CVEs in libs you already had installed
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy · full report (doesn't break the pipeline, just informs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-sca

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif

      - name: Trivy · gate (breaks the pipeline only on CRITICAL findings)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: 'CRITICAL'
          exit-code: '1'

  dependency-review:
    # Compares only the dependencies that change in the PR against the base.
    # Requires the repo to have the "dependency graph" enabled (free, under
    # Settings → Code security). Does not require GHAS.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
