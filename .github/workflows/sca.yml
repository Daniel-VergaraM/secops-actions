name: "Seguridad · SCA"
# Análisis de librerías de TERCEROS (no corre nada, solo lee manifiestos/lockfiles).
# Motor: Trivy (fs scan) — detecta solo npm/yarn/pnpm, pip/poetry/pipenv, go.mod/go.sum,
# Gemfile.lock, composer.lock, Cargo.lock, csproj/packages.lock.json, etc. sin configurar
# nada por lenguaje. Se complementa con dependency-review-action en PRs.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 5 * * *' # diario: te avisa de CVEs nuevos en libs que ya tenías instaladas
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cachear la base de datos de vulnerabilidades de Trivy
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy · reporte completo (no rompe el pipeline, solo informa)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Subir resultados a GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-sca

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif

      - name: Trivy · gate (rompe el pipeline solo si hay CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: 'CRITICAL'
          exit-code: '1'

  dependency-review:
    # Compara únicamente las dependencias que cambian en el PR contra la base.
    # Requiere que el repo tenga el "dependency graph" activo (gratis, en
    # Settings → Code security). No requiere GHAS.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
