name: "Security · SAST (CodeQL)"
# Complement to sast.yml (Semgrep). Split into its own file because:
#
#   1) CodeQL Action is free with no limits on PUBLIC repos, but on PRIVATE
#      repos it requires GitHub Advanced Security (paid). This workflow
#      checks the repo's actual visibility via the GitHub API before
#      running anything, and SKIPS itself on private repos only, so it
#      doesn't fail on licensing or burn CI minutes on something you
#      wouldn't be able to use anyway. If your org does have GHAS, set the
#      repo variable CODEQL_FORCE_RUN=true (Settings → Secrets and
#      variables → Actions → Variables) to force it on private repos too.
#
#   2) GitHub Actions doesn't let you use `needs:` across different
#      workflow files, so the real way to chain them is with the
#      workflow_run trigger: this file fires as soon as "Security · SAST"
#      (sast.yml) finishes — in other words, sast.yml is, in practice, its
#      dependency. workflow_run only activates for workflows that already
#      exist on the default branch, so the first time you'll need to merge
#      both files into main/master before you see this one run.
#
# If you already have CodeQL's "default setup" enabled for this repo under
# Settings → Code security, do NOT also use this workflow: GitHub doesn't
# allow the default setup and an advanced CodeQL workflow to run at the
# same time for the same language.

on:
  workflow_run:
    workflows: ["Security · SAST"]
    types: [completed]
  workflow_dispatch:
  workflow_call:
    inputs:
      codeql_force_run:
        type: string
        required: false
        default: 'false'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  visibility:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      is_public: ${{ steps.check.outputs.is_public }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          visibility=$(gh api "repos/${{ github.repository }}" --jq .visibility)
          echo "Repo visibility: $visibility"

          if [ "$visibility" = "public" ]; then
            echo "is_public=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_public=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  detect:
    needs: visibility
    if: needs.visibility.outputs.is_public == 'true' || (inputs.codeql_force_run || vars.CODEQL_FORCE_RUN) == 'true'
    runs-on: ubuntu-latest
    outputs:
      codeql_languages: ${{ steps.detect.outputs.codeql_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.visibility.outputs.ref }}
      - id: detect
        uses: ./.github/actions/detect-stack

  codeql:
    needs: [visibility, detect]
    if: >-
      (needs.visibility.outputs.is_public == 'true' || (inputs.codeql_force_run || vars.CODEQL_FORCE_RUN) == 'true')
      && needs.detect.outputs.codeql_languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.codeql_languages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.visibility.outputs.ref }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "codeql-${{ matrix.language }}"

  private-repo-no-ghas:
    needs: visibility
    if: needs.visibility.outputs.is_public != 'true' && (inputs.codeql_force_run || vars.CODEQL_FORCE_RUN) != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::Private repo and CODEQL_FORCE_RUN is not 'true', so CodeQL is being skipped (it requires paid GitHub Advanced Security on private repos). Semgrep, in sast.yml, already covers SAST for you at no cost. If your organization does have GHAS, set the repo variable CODEQL_FORCE_RUN=true to run it anyway."
