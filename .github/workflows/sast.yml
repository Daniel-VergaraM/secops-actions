name: "Security · SAST"
# Static analysis of OWN code (runs nothing, only reads the source code).
# Engine: Semgrep (no config, zero secrets, runs the same in public or private).
#
# CodeQL lives separately, in codeql-sast.yml, because on private repos it
# requires a license (GitHub Advanced Security) and that file decides on its
# own whether it can run based on the repo's visibility. It triggers
# automatically when THIS workflow finishes (workflow_run) — in practice,
# this file is its dependency.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '30 4 * * 1' # Monday 04:30 UTC
  workflow_dispatch:
  workflow_call:
    secrets:
      semgrep_token:
        required: false
        description: 'Optional Semgrep App Token (the Semgrep CLI reads it via the SEMGREP_APP_TOKEN env var)'

permissions:
  contents: read
  security-events: write

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: "Semgrep (config auto: detects language and rules on its own, no token needed)"
        # --config auto downloads the Semgrep Registry rule set that applies
        # to whatever it finds in the repo. It doesn't need SEMGREP_APP_TOKEN for this.
        # continue-on-error: you decide actual severity by viewing the SARIF in the
        # Security tab; if you'd rather the PR fail on findings, remove this line.
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.semgrep_token }}
        run: semgrep scan --config auto --sarif > semgrep-results.sarif

      - name: Upload results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
