name: "Seguridad · SAST"
# Análisis estático del código PROPIO (no corre nada, solo lee el código fuente).
# Motor: Semgrep (sin config, cero secretos, corre igual en público o privado).
#
# CodeQL vive aparte, en codeql-sast.yml, porque en repos privados requiere
# licencia (GitHub Advanced Security) y ese archivo decide solo si puede correr
# según la visibilidad del repo. Se dispara automáticamente cuando ESTE workflow
# termina (workflow_run) — en la práctica, este archivo es su dependencia.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '30 4 * * 1' # lunes 04:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: "Semgrep (config auto: detecta lenguaje y reglas solo, sin token)"
        # --config auto descarga el set de reglas de la Semgrep Registry que aplica
        # a lo que encuentre en el repo. No necesita SEMGREP_APP_TOKEN para esto.
        # continue-on-error: la severidad real la decides tú viendo el SARIF en la
        # pestaña Security; si prefieres que el PR falle con hallazgos, quita esta línea.
        continue-on-error: true
        run: semgrep scan --config auto --sarif > semgrep-results.sarif

      - name: Subir resultados a GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
