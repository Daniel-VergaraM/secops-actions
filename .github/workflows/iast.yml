name: "Security · IAST (approximation)"
# READ THIS FIRST: there is currently no real IAST tool (with taint-tracking)
# that is free/open-source and covers Go, TypeScript/Node and Python at once.
#   - Contrast Community Edition (the only serious free IAST) was DISCONTINUED
#     on 2025-06-30. Today Contrast Assess is 100% commercial.
#   - OpenRASP (Baidu, open source) is still free but has been inactive since 2022
#     and only covers Java and PHP well on traditional application servers.
#   - Datadog Code Security (IAST) is commercial, with a 14-day trial.
#
# What this workflow DOES do, for free: it boots your app with NATIVE
# language coverage instrumentation (a real agent running inside the process:
# go cover / coverage.py / c8 / jacoco), attacks it with ZAP while it runs, and
# cross-references both results. That tells you which code actually ran during
# the attack (gray-box view / "glass-box testing") — useful and real, but it is
# NOT taint-tracking: it does not tell you whether attacker-controlled data
# reached a SQL query unsanitized, for example.
# If you really need that, the honest option is to pay for Datadog IAST or
# Contrast Assess.
#
# THE ONLY manual configuration that cannot be autodetected: the command that
# starts your app. Define it in Settings -> Secrets and variables -> Actions ->
# Variables as IAST_START_CMD (e.g. "node dist/server.js", "python -m app",
# "go run ."). If you don't define it, this workflow skips itself (it does not
# fail the pipeline).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # weekly
  workflow_call:
    inputs:
      iast_start_cmd:
        type: string
        required: false
        default: ''
      dast_app_port:
        type: string
        required: false
        default: '8080'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      primary_language: ${{ steps.detect.outputs.primary_language }}
      start_cmd_set: ${{ steps.check.outputs.start_cmd_set }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: ./.github/actions/detect-stack
      - id: check
        run: echo "start_cmd_set=${{ (inputs.iast_start_cmd || vars.IAST_START_CMD) != '' }}" >> "$GITHUB_OUTPUT"

  approximate-iast:
    needs: detect
    if: needs.detect.outputs.start_cmd_set == 'true'
    runs-on: ubuntu-latest
    env:
      START_CMD: ${{ inputs.iast_start_cmd || vars.IAST_START_CMD }}
      APP_PORT: ${{ inputs.dast_app_port || vars.DAST_APP_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare instrumentation based on the detected language
        run: |
          set -e
          case "${{ needs.detect.outputs.primary_language }}" in
            Go) go version ;;
            Python) python3 -m pip install --quiet coverage ;;
            TypeScript|JavaScript)
              [ -f package.json ] && npm ci --silent || true
              npm install --no-save c8 --silent ;;
            Java|Kotlin)
              curl -sSL -o jacocoagent.jar \
                https://repo1.maven.org/maven2/org/jacoco/org.jacoco.agent/0.8.12/org.jacoco.agent-0.8.12-runtime.jar ;;
            *)
              echo "::notice::I don't have a coverage recipe for '${{ needs.detect.outputs.primary_language }}' yet; the app will start without instrumentation (only the ZAP attack part will remain)." ;;
          esac

      - name: Start the app with the coverage agent attached
        run: |
          set -e
          mkdir -p covdata iast-coverage
          case "${{ needs.detect.outputs.primary_language }}" in
            Go)
              GOCOVERDIR="$PWD/covdata" nohup $START_CMD > app.log 2>&1 &
              ;;
            Python)
              nohup coverage run --branch -m $START_CMD > app.log 2>&1 &
              ;;
            TypeScript|JavaScript)
              nohup npx c8 --reporter=json --report-dir=iast-coverage $START_CMD > app.log 2>&1 &
              ;;
            Java|Kotlin)
              nohup java -javaagent:jacocoagent.jar=destfile=jacoco.exec $START_CMD > app.log 2>&1 &
              ;;
            *)
              nohup $START_CMD > app.log 2>&1 &
              ;;
          esac
          echo $! > app.pid
          for i in $(seq 1 30); do
            curl -sf "http://localhost:${APP_PORT}" > /dev/null && break
            sleep 5
          done

      - name: Attack the running app with ZAP (the dynamic part)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:${{ env.APP_PORT }}
          fail_action: false

      - name: Stop the app
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

      - name: Close out the coverage report reached during the attack
        if: always()
        run: |
          case "${{ needs.detect.outputs.primary_language }}" in
            Go) go tool covdata percent -i=covdata || true ;;
            Python) coverage html -d iast-coverage || true ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approximate-iast
          path: |
            app.log
            iast-coverage/**
            jacoco.exec
          if-no-files-found: ignore

  reminder:
    needs: detect
    if: needs.detect.outputs.start_cmd_set != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::IAST_START_CMD is not defined as a repo variable, so I'm skipping this workflow. This is not an error: there is simply no way to autodetect how your app starts. Define it in Settings -> Secrets and variables -> Actions -> Variables if you want this IAST approximation."
