name: "Seguridad · DAST"
# Ataca la app CORRIENDO, desde afuera, como lo haría un atacante real (caja negra).
# Motor: OWASP ZAP (baseline = pasivo y rápido; full = activo y más agresivo).
#
# Resolución del target, en este orden:
#   1) target_url que pases manualmente al disparar el workflow
#   2) variable de repo DAST_TARGET_URL (tu staging/preview real) — RECOMENDADO
#   3) si no hay ninguna de las dos: intenta levantar la app él mismo con
#      docker-compose.yml o Dockerfile y atacar localhost
#   4) si nada de eso existe, falla con un mensaje explicando qué falta

on:
  schedule:
    - cron: '0 6 * * 1' # semanal
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL a atacar (vacío = usar DAST_TARGET_URL o levantar la app yo mismo)'
        required: false
        default: ''
      scan_type:
        description: 'baseline (pasivo) o full (activo, más lento y agresivo)'
        required: false
        default: 'baseline'
        type: choice
        options: [baseline, full]

permissions:
  contents: read
  security-events: write

jobs:
  resolver-target:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      modo: ${{ steps.resolve.outputs.modo }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: ./.github/actions/detect-stack
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          port="${{ vars.DAST_APP_PORT || '8080' }}"

          if [ -n "${{ inputs.target_url }}" ]; then
            echo "target=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
            echo "modo=externo" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.DAST_TARGET_URL }}" ]; then
            echo "target=${{ vars.DAST_TARGET_URL }}" >> "$GITHUB_OUTPUT"
            echo "modo=externo" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.detect.outputs.has_compose }}" = "true" ]; then
            echo "target=http://localhost:${port}" >> "$GITHUB_OUTPUT"
            echo "modo=compose" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.detect.outputs.has_dockerfile }}" = "true" ]; then
            echo "target=http://localhost:${port}" >> "$GITHUB_OUTPUT"
            echo "modo=dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No encontré docker-compose.yml ni Dockerfile, y no definiste target_url ni la variable de repo DAST_TARGET_URL. Define DAST_TARGET_URL en Settings → Secrets and variables → Actions → Variables apuntando a tu entorno de staging, o dispara este workflow manualmente con target_url."
            exit 1
          fi

  dast:
    needs: resolver-target
    runs-on: ubuntu-latest
    env:
      APP_PORT: ${{ vars.DAST_APP_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Levantar con docker compose
        if: needs.resolver-target.outputs.modo == 'compose'
        run: docker compose up -d --build

      - name: Levantar con Dockerfile
        if: needs.resolver-target.outputs.modo == 'dockerfile'
        run: |
          docker build -t app-bajo-prueba .
          docker run -d -p "${APP_PORT}:${APP_PORT}" app-bajo-prueba

      - name: Esperar a que el target responda
        if: needs.resolver-target.outputs.modo == 'compose' || needs.resolver-target.outputs.modo == 'dockerfile'
        run: |
          for i in $(seq 1 30); do
            curl -sf "${{ needs.resolver-target.outputs.target }}" > /dev/null && exit 0
            echo "Esperando a ${{ needs.resolver-target.outputs.target }} ($i/30)..."
            sleep 5
          done
          echo "::warning::El target no respondió a tiempo; ZAP igual intentará conectarse."

      - name: ZAP Baseline Scan (pasivo)
        if: inputs.scan_type != 'full'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ needs.resolver-target.outputs.target }}
          fail_action: false
          cmd_options: '-a'

      - name: ZAP Full Scan (activo)
        if: inputs.scan_type == 'full'
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ needs.resolver-target.outputs.target }}
          fail_action: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore

# Nota: los action de ZAP ya suben su propio reporte como artifact y pueden abrir un
# Issue con los hallazgos (desactivado aquí con fail_action/`cmd_options`). Si quieres
# que el PR falle ante hallazgos de riesgo alto, cambia fail_action a true.
